<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google - Chrome Extension Test Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #fff;
    }
    .search-container {
      text-align: center;
    }
    .logo {
      font-size: 92px;
      font-weight: bold;
      margin-bottom: 30px;
    }
    .logo .g1 { color: #4285F4; }
    .logo .o1 { color: #EA4335; }
    .logo .o2 { color: #FBBC05; }
    .logo .g2 { color: #4285F4; }
    .logo .l  { color: #34A853; }
    .logo .e  { color: #EA4335; }
    .search-box {
      width: 580px;
      height: 44px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      padding: 0 20px;
      font-size: 16px;
      outline: none;
    }
    .search-box:hover {
      box-shadow: 0 1px 6px rgba(32,33,36,.28);
    }
    .buttons {
      margin-top: 20px;
    }
    .buttons button {
      background: #f8f9fa;
      border: 1px solid #f8f9fa;
      border-radius: 4px;
      color: #3c4043;
      font-size: 14px;
      padding: 0 16px;
      height: 36px;
      margin: 0 4px;
      cursor: pointer;
    }
    .info {
      margin-top: 40px;
      color: #999;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="search-container">
    <div class="logo">
      <span class="g1">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span>
    </div>
    <input class="search-box" type="text" placeholder="Search Google or type a URL" autofocus>
    <div class="buttons">
      <button>Google Search</button>
      <button>I'm Feeling Lucky</button>
    </div>
    <div class="info">
      <p>Local test page - simulating google.com for Chrome extension testing</p>
      <p>Environment: Sandboxed (no external network access)</p>
    </div>
  </div>
</body>
</html>
