name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flowchart/package-lock.json

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: shellcheck ralph.sh automate.sh

      - name: Install flowchart dependencies
        run: npm ci
        working-directory: flowchart

      - name: ESLint
        run: npm run lint
        working-directory: flowchart

      - name: TypeScript type check
        run: npx tsc -b --noEmit
        working-directory: flowchart

      - name: Build flowchart
        run: npm run build
        working-directory: flowchart
